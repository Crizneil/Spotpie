[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "criz-spotpie"
version = "1.0.0"
description = "Spotify Terminal Utility (Linux Frontend for SpotX)"
authors = [
    { name = "Crizneil" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.scripts]
criz-spotpie = "criz_spotpie.cli:main"

[tool.setuptools.packages.find]
include = ["criz_spotpie*"]
